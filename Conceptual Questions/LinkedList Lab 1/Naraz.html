<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are You Still Angry?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            color: #333;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 90%;
            z-index: 10;
        }
        h1 { color: #d9534f; margin-top: 0; }
        h2 { color: #555; }
        h3 { color: #d9534f; }
        
        .btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover { background-color: #ff1a1a; transform: scale(1.05); }
        
        #question-screen, #success-screen { display: none; }
        
        #no-btn { position: relative; }
        
        .heart {
            position: absolute;
            font-size: 24px;
            color: red;
            animation: float linear forwards;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Screen 1: The Error -->
    <div class="container" id="main-screen">
        <h1>⚠️ FRIENDSHIP ERROR 404 ⚠️</h1>
        <h2>Best Friend Not Responding...</h2>
        <h3>Status: ANGRY 😤</h3>
        <br>
        <button class="btn" onclick="nextScreen()">🥺 Sorry, maan jao</button><br>
        <button class="btn" onclick="nextScreen()">❤️ I miss you</button><br>
        <button class="btn" onclick="nextScreen()">😭 Please forgive me</button>
    </div>

    <!-- Screen 2: The Runaway Button -->
    <div class="container" id="question-screen">
        <h2>Will you forgive me?</h2>
        <button class="btn" id="yes-btn" onclick="showSuccess()">Yes ❤️</button>
        <!-- Added ontouchstart so it dodges mobile users trying to tap it -->
        <button class="btn" id="no-btn" onmouseover="moveButton()" ontouchstart="moveButton()">No 😤</button>
    </div>

    <!-- Screen 3: Restored -->
    <div class="container" id="success-screen">
        <h1>Friendship Status: RESTORED ❤️</h1>
        <h2>Yay! ✨</h2>
    </div>

    <script>
        function nextScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('question-screen').style.display = 'block';
        }

        function moveButton() {
            const btn = document.getElementById('no-btn');
            // Calculate maximum bounds to keep the button inside the visible window
            const maxX = window.innerWidth - btn.clientWidth - 20;
            const maxY = window.innerHeight - btn.clientHeight - 20;
            
            const randomX = Math.max(10, Math.random() * maxX);
            const randomY = Math.max(10, Math.random() * maxY);
            
            btn.style.position = 'absolute';
            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;
        }

        function showSuccess() {
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
            createFireworks();
        }

        function createFireworks() {
            // Generate floating hearts every 200ms
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('heart');
                
                // Random horizontal position
                heart.style.left = Math.random() * 100 + 'vw';
                
                // Random animation duration between 2s and 5s
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                
                document.body.appendChild(heart);
                
                // Cleanup hearts from the DOM after they float away
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 200);
        }
    </script>
</body>
</html>
