<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Restoration Protocol</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Subtle scanline effect for that retro terminal look */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .terminal {
            width: 100%;
            max-width: 600px;
            background-color: #0a0a0a;
            padding: 30px;
            border: 1px solid #00ff00;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .line {
            margin-bottom: 10px;
            line-height: 1.5;
            font-size: 1.1rem;
            opacity: 0;
        }

        .red { color: #ff3333; font-weight: bold; text-shadow: 0 0 5px #ff3333; }
        .yellow { color: #ffcc00; }
        .bar { letter-spacing: 2px; }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: #00ff00;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .btn-start {
            display: none;
            background-color: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 12px 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            text-transform: uppercase;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-start:hover {
            background-color: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }

        #mission-screen {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="terminal" id="terminal-screen">
        <div id="output"></div>
        <span class="cursor" id="cursor"></span>
        <button class="btn-start" id="start-btn" onclick="startMission()">> START MISSION_</button>
    </div>

    <div class="terminal" id="mission-screen">
        <h2 class="yellow">SYSTEM OVERRIDE AUTHORIZED</h2>
        <p>Connecting to target heart... ⏳</p>
        <p class="red">STANDBY FOR STEP 2...</p>
    </div>

    <script>
        // The sequence of lines to appear in the terminal
        const lines = [
            "INITIALIZING FRIENDSHIP RECOVERY SYSTEM...",
            "Scanning database...",
            "<br>",
            "Friendship Status:",
            "<span class='bar yellow'>████████████████░░░░</span>  80%",
            "<br>",
            "<span class='red'>⚠️ WARNING ⚠️</span>",
            "USER: <span class='yellow'>Nimooooo</span>", // Edit her name here!
            "STATUS: <span class='red'>ANGRY 😤</span>",
            "Reason:",
            "<span class='red'>[REDACTED]</span>",
            "<br>",
            "Recovery protocol initiated..."
        ];

        const outputDiv = document.getElementById("output");
        const startBtn = document.getElementById("start-btn");
        let currentLine = 0;

        function typeLine() {
            if (currentLine < lines.length) {
                // Create a new div for the line
                const lineElement = document.createElement("div");
                lineElement.className = "line";
                lineElement.innerHTML = "> " + lines[currentLine];
                outputDiv.appendChild(lineElement);

                // Fade it in quickly
                setTimeout(() => {
                    lineElement.style.opacity = 1;
                }, 50);

                // Add a random delay for the next line to mimic real processing
                let delay = Math.random() * 600 + 400; 
                
                // Make breaks (<br>) and the progress bar process faster
                if(lines[currentLine] === "<br>" || lines[currentLine].includes("████")) {
                    delay = 200;
                }

                currentLine++;
                setTimeout(typeLine, delay);
            } else {
                // Finished typing, show the button
                setTimeout(() => {
                    startBtn.style.display = "block";
                    // Scroll to bottom just in case
                    outputDiv.scrollTop = outputDiv.scrollHeight;
                }, 500);
            }
        }

        // Start the sequence when the page loads
        window.onload = () => {
            setTimeout(typeLine, 1000); // 1 second initial delay
        };

        function startMission() {
            document.getElementById("terminal-screen").style.display = "none";
            document.getElementById("mission-screen").style.display = "block";
        }
    </script>
</body>
</html>
